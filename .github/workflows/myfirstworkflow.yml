name: My First Workflow
on: 
  push:
jobs:
  print:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Repo Clone 
        uses: actions/checkout@v4

      - name: Setup Node version
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


